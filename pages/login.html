<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#76265f"><title>Acceso | Estética Spa Sayuri</title>
<link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/rrhh.css">
<script src="../js/config.js" defer></script><script src="../js/api.js" defer></script><script src="../js/app.js" defer></script>
</head>
<body class="rrhh-body">
<header class="rrhh-top"><a class="brand" href="../index.html"><img src="../assets/logo-sayuri.png" alt="Estética Spa Sayuri"><span><strong>Estética Spa</strong><em>Sayuri</em></span></a><a class="back-link" href="../index.html">← Volver al sitio</a></header>
<main class="auth-main">
<section class="auth-card">
<img class="auth-logo" src="../assets/logo-sayuri.png" alt="">
<p class="eyebrow">Acceso personal</p>
<h1>Portal de trabajo</h1>
<p class="auth-intro">Ingresa con tu usuario y contraseña para acceder a tu espacio de trabajo.</p>
<form id="login-form">
<label for="username">Usuario</label><input id="username" name="username" type="text" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="button button-primary full" type="submit">Ingresar</button>
<p class="form-message" id="login-message" role="alert"></p>
</form>
<p class="security-note">La autenticación real se realizará mediante la API segura de Google Apps Script. No se almacenan contraseñas en esta página.</p>
</section>
</main>

<script src="../js/login.js" defer></script>
</body></html>
